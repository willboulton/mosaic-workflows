---
snakefile: workflow/Snakefile
latency-wait: 30
show-failed-logs: True
keep-going: True
printshellcmds: True
rerun-incomplete: True
rerun-trigger: mtime
restart-times: 0
use-conda: True
conda-frontend: conda
latency-wait: 100
use-envmodules: True

# Cluster submission
executor: slurm
jobname: "{rule}.{jobid}"
max-jobs-per-second: 1
max-status-checks-per-second: 10
jobs: 64 # max number of jobs running in parallel
# Set resources for particular jobs
# Default cluster resources
default-resources:
    - mem="4G"
    - slurm_partition="compute-64-512,compute-24-96"
    - runtime="4h" # days:hours:mins, or number in minutes
    - cpus_per_task=1

set-resources:
    #- deinterleave:mem="2G"
    #- deinterleave:slurm_partition="compute-64-512,compute-24-96"
    #- deinterleave:runtime=240
    #- deinterleave:cpus_per_task=4
    
    - centrifuge_on_contigs:mem="180G"
    - centrifuge_on_contigs:slurm_partition="compute-64-512"
    - centrifuge_on_contigs:runtime=45
    - centrifuge_on_contigs:cpus_per_task=16

    - bwa_mem:mem="8G"
    - bwa_mem:slurm_partition="compute-64-512,compute-24-96"
    - bwa_mem:runtime=120
    - bwa_mem:cpus_per_task=8
    # bwa index: 3134.908 sec; CPU: 2955.861 sec 4 threads 24 GB 
    # bwa mem - 24 GB 4 threads probably about 10-12 hours... 25000s = 7hrs

    - get_unmapped_reads:mem="8G"
    - get_unmapped_reads:slurm_partition="compute-64-512,compute-24-96"
    - get_unmapped_reads:runtime=240
    - get_unmapped_reads:cpus_per_task=8

    #- centrifuge_on_reads:mem="480G"
    #- centrifuge_on_reads:slurm_partition="compute-64-512"
    #- centrifuge_on_reads:runtime=720
    #- centrifuge_on_reads:cpus_per_task=16

    - mmseqs:mem="240G"
    - mmseqs:slurm_partition="compute-64-512"
    - mmseqs:runtime=180
    - mmseqs:cpus_per_task=24

    - metabat_single_assembly:mem="8G"
    - metabat_single_assembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_single_assembly:runtime=90
    - metabat_single_assembly:cpus_per_task=4

    - metabat_coassembly:mem="8G"
    - metabat_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_coassembly:runtime=90
    - metabat_coassembly:cpus_per_task=4

    - metabat_multiassembly:mem="8G"
    - metabat_multiassembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_multiassembly:runtime=90
    - metabat_multiassembly:cpus_per_task=4

    - strobealign_single_sample:mem="48G"
    - strobealign_single_sample:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_single_sample:runtime=240
    - strobealign_single_sample:cpus_per_task=8

    - strobealign_x_sample:mem="48G"
    - strobealign_x_sample:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_x_sample:runtime=240
    - strobealign_x_sample:cpus_per_task=8
    # strobealign indexing took 71 seconds on 4 threads, 24 GB mem
    # strobealign mapping might take: 
    # Total time mapping: 6488 s i.e. about 2 hours + I think 1 more hour. 
    # Something like 2 1/2 hours. 

    - strobealign_x_coassembly:mem="48G"
    - strobealign_x_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_x_coassembly:runtime=240
    - strobealign_x_coassembly:cpus_per_task=8

    #- kallisto_index:mem="64GB"
    #- kallisto_index:slurm_partition="compute-64-512,compute-24-96"
    #- kallisto_index:runtime=360
    #- kallisto_index:cpus_per_task=8

    #- kallisto_x_sample:mem="32GB"
    #- kallisto_x_sample:slurm_partition="compute-64-512,compute-24-96"
    #- kallisto_x_sample:runtime=120
    #- kallisto_x_sample:cpus_per_task=8
    # kallisto index: 24 GB 4 threads ran OOM
    # on 32 GB similar to strobealign

    - vamb_single_assembly:mem="4G"
    - vamb_single_assembly:slurm_partition="gpu-rtx6000-2"
    - vamb_single_assembly:runtime=60
    - vamb_single_assembly:cpus_per_task=16
    - vamb_single_assembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - vamb_coassembly:mem="4G"
    - vamb_coassembly:slurm_partition="gpu-rtx6000-2"
    - vamb_coassembly:runtime=60
    - vamb_coassembly:cpus_per_task=16
    - vamb_coassembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - vamb_multiassembly:mem="4G"
    - vamb_multiassembly:slurm_partition="gpu-rtx6000-2"
    - vamb_multiassembly:runtime=60
    - vamb_multiassembly:cpus_per_task=16
    - vamb_multiassembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - checkm2:mem="32G"
    - checkm2:slurm_partition="compute-64-512,compute-24-96"
    - checkm2:runtime=240
    - checkm2:cpus_per_task=16

    - megahit:mem="464G"
    - megahit:slurm_partition="hmem-4T,hmem-754,compute-64-512"
    - megahit:runtime=2880
    - megahit:cpus_per_task=48
    - megahit:slurm_extra=r"--qos=hmem"

    - tiara:mem="16G"
    - tiara:slurm_partition="compute-64-512,compute-24-96"
    - tiara:runtime=120
    - tiara:cpus_per_task=4

    - comebin_single_assembly:mem="64G"
    - comebin_single_assembly:slurm_partition="gpu-rtx6000-2"
    - comebin_single_assembly:runtime=720
    - comebin_single_assembly:cpus_per_task=8
    - comebin_single_assembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - cbin_00_preprocessing:mem="8G"
    - cbin_00_preprocessing:slurm_partition="compute-64-512,compute-24-96"
    - cbin_00_preprocessing:runtime=60
    - cbin_00_preprocessing:cpus_per_task=1

    - cbin_01_augmentation_data:mem="12G"
    - cbin_01_augmentation_data:slurm_partition="compute-64-512,compute-24-96"
    - cbin_01_augmentation_data:runtime=240
    - cbin_01_augmentation_data:cpus_per_task=8

    - cbin_02_training:mem="12G"
    - cbin_02_training:slurm_partition="gpu-rtx6000-2"
    - cbin_02_training:runtime=480
    - cbin_02_training:cpus_per_task=8
    - cbin_02_training:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - cbin_03_leiden_clustering:mem="64G"
    - cbin_03_leiden_clustering:slurm_partition="gpu-rtx6000-2"
    - cbin_03_leiden_clustering:runtime=720
    - cbin_03_leiden_clustering:cpus_per_task=8

    - mmseqs_lca:mem="16G"
    - mmseqs_lca:slurm_partition="compute-64-512,compute-24-96"
    - mmseqs_lca:runtime=30
    - mmseqs_lca:cpus_per_task=1

    - vacuum_single_assembly:mem="16G"
    - vacuum_single_assembly:slurm_partition="compute-64-512,compute-24-96"
    - vacuum_single_assembly:runtime=100
    - vacuum_single_assembly:cpus_per_task=1

    - extract_files:mem="16G"
    - extract_files:slurm_partition="compute-64-512,compute-24-96"
    - extract_files:runtime=45
    - extract_files:cpus_per_task=1

    - aggregate_taxonomy:mem="8G"
    - aggregate_taxonomy:slurm_partition="compute-64-512,compute-24-96"
    - aggregate_taxonomy:runtime=60
    - aggregate_taxonomy:cpus_per_task=1

    - concat_fastq:mem="8G"
    - concat_fastq:slurm_partition="compute-64-512,compute-24-96"
    - concat_fastq:runtime=60
    - concat_fastq:cpus_per_task=1

    - split_fastq:mem="24G"
    - split_fastq:slurm_partition="compute-64-512,compute-24-96"
    - split_fastq:runtime=240
    - split_fastq:cpus_per_task=4

    - concat_fasta:mem="32G"
    - concat_fasta:slurm_partition="compute-64-512,compute-24-96"
    - concat_fasta:runtime=60
    - concat_fasta:cpus_per_task=3

    - template:mem="64G"
    - template:slurm_partition="compute-64-512,compute-24-96"
    - template:runtime=600
    - template:cpus_per_task=32

set-threads:
    #- deinterleave=4
    - centrifuge_on_contigs=16
    - bwa_mem=8
    - get_unmapped_reads=8
    #- centrifuge_on_reads=16
    - mmseqs=16
    - metabat_single_assembly=4
    - metabat_coassembly=4
    - metabat_multiassembly=4
    #- kallisto_index=8
    #- kallisto_x_sample=8
    - strobealign_single_sample=8
    - strobealign_x_sample=8
    - strobealign_x_coassembly=8
    - vamb_single_assembly=16
    - vamb_coassembly=16
    - vamb_multiassembly=16
    - checkm2=16
    - megahit=48
    - tiara=4
    - comebin_single_assembly=8
    - cbin_00_preprocessing=1
    - cbin_01_augmentation_data=8
    - cbin_02_training=8
    - cbin_03_leiden_clustering=8
    - mmseqs_lca=1
    - vacuum_single_assembly=1
    - aggregate_taxonomy=1
    - concat_fastq=1
    - concat_fasta=4
    - split_fastq=4
    - template=1