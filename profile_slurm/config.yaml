    - cbin_02_coassembly:mem="32G"
    - cbin_02_coassembly:slurm_partition="compute-64-512,compute-24-96" #"gpu-rtx6000-2"
    - cbin_02_coassembly:runtime=1800
    - cbin_02_coassembly:cpus_per_task=8
    #- cbin_02_coassembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - cbin_02_multiassembly:mem="32G"
    - cbin_02_multiassembly:slurm_partition="compute-64-512,compute-24-96" #"gpu-rtx6000-2"
    - cbin_02_multiassembly:runtime=1800
    - cbin_02_multiassembly:cpus_per_task=8
    #- cbin_02_multiassembly:slurm_extra=r"--qos=gpu-rtx --gres=gpu:1"

    - cbin_03_leiden_clustering:mem="64G"
    - cbin_03_leiden_clustering:slurm_partition="compute-64-512,compute-24-96"
    - cbin_03_leiden_clustering:runtime=720
    - cbin_03_leiden_clustering:cpus_per_task=8
    
    - cbin_03_coassembly:mem="64G"
    - cbin_03_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - cbin_03_coassembly:runtime=720
    - cbin_03_coassembly:cpus_per_task=8

    - cbin_03_multiassembly:mem="64G"
    - cbin_03_multiassembly:slurm_partition="compute-64-512,compute-24-96"
    - cbin_03_multiassembly:runtime=720
    - cbin_03_multiassembly:cpus_per_task=8

    - cbin_04_bin_qc:mem="64G"
    - cbin_04_bin_qc:slurm_partition="compute-64-512,compute-24-96"
