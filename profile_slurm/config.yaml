---
snakefile: workflow/Snakefile
latency-wait: 30
show-failed-logs: True
keep-going: True
printshellcmds: True
rerun-incomplete: True
rerun-trigger: mtime
restart-times: 0
use-conda: True
conda-frontend: conda
latency-wait: 100
use-envmodules: True

# Cluster submission
executor: slurm
jobname: "{rule}.{jobid}"
max-jobs-per-second: 1
max-status-checks-per-second: 10
jobs: 64 # max number of jobs running in parallel
# Set resources for particular jobs
# Default cluster resources
default-resources:
    - mem="4G"
    - slurm_partition="compute-64-512,compute-24-96"
    - runtime="4h" # days:hours:mins, or number in minutes
    - cpus_per_task=1

set-resources:
    #- deinterleave:mem="2G"
    #- deinterleave:slurm_partition="compute-64-512,compute-24-96"
    #- deinterleave:runtime=240
    #- deinterleave:cpus_per_task=4
    
    - centrifuge_on_contigs:mem="180G"
    - centrifuge_on_contigs:slurm_partition="compute-64-512"
    - centrifuge_on_contigs:runtime=45
    - centrifuge_on_contigs:cpus_per_task=16

    - bwa_mem:mem="8G"
    - bwa_mem:slurm_partition="compute-64-512,compute-24-96"
    - bwa_mem:runtime=120
    - bwa_mem:cpus_per_task=8
    # bwa index: 3134.908 sec; CPU: 2955.861 sec 4 threads 24 GB 
    # bwa mem - 24 GB 4 threads probably about 10-12 hours... 25000s = 7hrs

    - get_unmapped_reads:mem="8G"
    - get_unmapped_reads:slurm_partition="compute-64-512,compute-24-96"
    - get_unmapped_reads:runtime=240
    - get_unmapped_reads:cpus_per_task=8

    - mmseqs:mem="480G" #240G
    - mmseqs:slurm_partition="compute-64-512"
    - mmseqs:runtime=180
    - mmseqs:cpus_per_task=24

    - metabat_single_assembly:mem="16G"
    - metabat_single_assembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_single_assembly:runtime=180
    - metabat_single_assembly:cpus_per_task=4

    - metabat_coassembly:mem="16G"
    - metabat_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_coassembly:runtime=90
    - metabat_coassembly:cpus_per_task=4

    - metabat_multiassembly:mem="48G" #"16G"
    - metabat_multiassembly:slurm_partition="compute-64-512,compute-24-96"
    - metabat_multiassembly:runtime=600  #90 #change back to 90, more is unnecessary!
    - metabat_multiassembly:cpus_per_task=4

    - strobealign_single_sample:mem="48G"
    - strobealign_single_sample:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_single_sample:runtime=360
    - strobealign_single_sample:cpus_per_task=12

    - samtools_sort:mem="48G"
    - samtools_sort:slurm_partition="compute-64-512,compute-24-96"
    - samtools_sort:runtime=1440
    - samtools_sort:cpus_per_task=4

    - strobealign_x_sample:mem="92G"
    - strobealign_x_sample:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_x_sample:runtime=600
    - strobealign_x_sample:cpus_per_task=8
    # strobealign indexing took 71 seconds on 4 threads, 24 GB mem
    # strobealign mapping might take: 
    # Total time mapping: 6488 s i.e. about 2 hours + I think 1 more hour. 
    # Something like 2 1/2 hours. 

    - strobealign_x_coassembly:mem="92G"
    - strobealign_x_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - strobealign_x_coassembly:runtime=480
    - strobealign_x_coassembly:cpus_per_task=8

    - semibin_single_assembly:mem="400G" #"32G"  #"16G" #4G
    - semibin_single_assembly:slurm_partition="compute-64-512,compute-24-96"
    - semibin_single_assembly:runtime=600  #240 #60
    - semibin_single_assembly:cpus_per_task=16

    - vamb_single_assembly:mem="16G"
    - vamb_single_assembly:slurm_partition="compute-64-512,compute-24-96"
    - vamb_single_assembly:runtime=360
    - vamb_single_assembly:cpus_per_task=8

    - vamb_coassembly:mem="16G"
    - vamb_coassembly:slurm_partition="compute-64-512,compute-24-96"
    - vamb_coassembly:runtime=240
    - vamb_coassembly:cpus_per_task=8

    - vamb_multiassembly:mem="64G" #"16G"
    - vamb_multiassembly:slurm_partition="compute-64-512,compute-24-96" #"gpu-rtx6000-2"
    - vamb_multiassembly:runtime=240
    - vamb_multiassembly:cpus_per_task=8
