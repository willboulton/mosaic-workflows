    - metabat_coassembly=4
    - metabat_multiassembly=4
    - semibin=8
    - strobealign_single_sample=12
    - samtools_sort=4
    - strobealign_x_sample=8
    - strobealign_x_coassembly=8
    - vamb_single_assembly=8
    - vamb_coassembly=8
    - vamb_multiassembly=8
    - vacuum_multiassembly=1
    - vacuum_coassembly=1
    - semibin_single_assembly=16
    - checkm2=16
    - eukcc_single_sample=3
    - megahit=48
    - tiara=4
    - comebin_single_assembly=8
    - cbin_00_preprocessing=1
    - cbin_00_coassembly=1
    - cbin_00_multiassembly=1
    - cbin_01_augmentation_data=8
    - cbin_01_coassembly=8
    - cbin_01_multiassembly=8
    - cbin_02_training=8
