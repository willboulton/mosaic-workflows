---
snakefile: workflow/Snakefile
latency-wait: 30
show-failed-logs: True
keep-going: True
printshellcmds: True
rerun-incomplete: True
rerun-trigger: mtime
restart-times: 0
use-conda: True
conda-frontend: conda
latency-wait: 100
use-envmodules: True

# Cluster submission
executor: slurm
jobname: "{rule}.{jobid}"
max-jobs-per-second: 1
max-status-checks-per-second: 10
jobs: 256 # max number of jobs running in parallel
# Set resources for particular jobs
# Default cluster resources
default-resources:
    - globus_workers=3
    - mem="4G"
    - slurm_partition="compute-64-512,compute-24-96"
    - runtime="4h" # days:hours:mins, or number in minutes
    - cpus_per_task=1

set-resources:
    - deinterleave:mem="2G"
    - deinterleave:slurm_partition="compute-64-512,compute-24-96"
    - deinterleave:runtime=240
    - deinterleave:cpus_per_task=4
    
    - centrifuge_on_contigs:mem="256G"
    - centrifuge_on_contigs:slurm_partition="compute-64-512"
    - centrifuge_on_contigs:runtime=600
    - centrifuge_on_contigs:cpus_per_task=16

    - centrifuge_on_reads:mem="480G"
    - centrifuge_on_reads:slurm_partition="compute-64-512"
    - centrifuge_on_reads:runtime=720
    - centrifuge_on_reads:cpus_per_task=16

set-threads:
    - deinterleave=4
    - centrifuge_on_contigs=16
    - centrifuge_on_reads=16
